   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182d40" x="17.676" y="36.0792" transform="rotate(-0 17.676 36.0792)">Where language interpretation enters the workflow</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182d40" x="17.676" y="77.3352" transform="rotate(-0 17.676 77.3352)">A   Classification and affiliation linkage</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(61.026461 140.930981)">Description or</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(61.491852 158.720044)">affiliation text</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(257.820766 142.045044)">Full reference index</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(254.259359 158.720044)">→ candidate shortlist</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(471.432922 140.930981)">Compare rules with</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(481.931164 158.720044)">model selection</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(675.775898 140.930981)">Code, organization set</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(688.26418 158.720044)">or review decision</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #435d72" x="21.168" y="212.1048" transform="rotate(-0 21.168 212.1048)">The same source universe supports retrieval. Missing candidates remain end-to-end errors.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182d40" x="17.676" y="251.298" transform="rotate(-0 17.676 251.298)">B   Questions about published statistics</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(56.448023 312.830981)">Analyst request</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(46.047711 330.620044)">+ source metadata</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(271.541703 313.945044)">Rules or model</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(253.075219 329.505981)">produce a query plan</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(469.834602 313.945044)">Frozen observations</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(474.908977 330.620044)">+ exact calculator</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(684.190664 313.358364)">Value, unit, sources</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #182d40" transform="translate(688.26418 330.620044)">or review decision</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #435d72" x="420.6528" y="421.8228" transform="rotate(-0 420.6528 421.8228)">Iterative arm only: inspect tool results, then revise the plan</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182d40" x="21.168" y="450.0144" transform="rotate(-0 21.168 450.0144)">Separate reference answers score decisions after prediction; they never enter model requests.</text>
   </g>
  </g>
